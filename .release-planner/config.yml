# Release Planner configuration: https://release-planner.fabricahq.com/customize/configuration/

# The format of this file.
schema-version: 1

# The Release Planner version to use. Bumping it upgrades the GitHub Actions workflow
# (.github/workflows/release-planner.yml) and the agent guide together; run
# release-planner install after changing it.
version: v0.4.3

# The version your first release must use.
first-version: v0.1.0

# Optional release-only checks, run on the release commit on the release pull request,
# before you approve it. Your required pull request checks already test what merges, so use
# this only for checks they don't run: a smoke test of what you ship, an API compatibility
# check against the previous release, a fresh vulnerability scan, or a slow end-to-end suite.
#
# Either a Bash script, with optional go, node, and python toolchains:
# release-checks:
#   go: '1.27.x'
#   run: |
#     go install golang.org/x/vuln/cmd/govulncheck@latest
#     govulncheck ./...
#
# Or one of your workflows, called with the commit to check and your repository's secrets.
# It needs a workflow_call trigger with a string input named ref, and must check out that ref:
# release-checks:
#   workflow: release-checks.yml

# Optional files to attach to each release, built from the release commit on the release
# pull request by one of your workflows, then attested and published when you merge. It
# needs a workflow_call trigger with string inputs ref, tag, and version; it must check out
# ref and upload the files as one artifact named release-assets. It gets no secrets.
# release-assets:
#   workflow: build-release.yml

# Optional workflows in other repositories to run after each new stable release, with
# inputs tag and version, such as one that updates a Homebrew formula. They run with a
# GitHub App token from the downstream environment.
# downstream:
#   - repository: your-org/homebrew-tap
#     workflow: update-formula.yml

# Release notes rules to turn off. release-planner validate checks the notes against every rule;
# list them with: release-planner validate --rules
# release-notes-rules:
#   no-long-heading: off

# Your own release notes style, if you want one: a markdown file, and how it combines with
# Release Planner's default style. append adds yours after the default; replace uses only yours.
# Print the default style with: release-planner guide --default-style
# release-notes-style:
#   file: .release-planner/release-notes-style.md
#   mode: append

# Where release notes live, and the branch that release pull requests merge into
# and releases are published from.
# release-notes-dir: _releases
# release-branch: main

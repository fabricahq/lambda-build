name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Container tests build for linux/arm64, so run them on that platform without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s test -v
        env:
          LAMBDA_BUILD_REQUIRE_DOCKER: '1'

  fixture-build:
    # Build the fixture through the reusable workflow, as an application would.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      config: examples/go-function/lambda-build.toml

  fixture-check:
    # Require the digest a macOS developer machine produced for the same fixture, and rebuild
    # the files with verify.
    needs: fixture-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Compare and verify
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          diff examples/go-function/expected-SHA256SUMS "$RELEASE_DIR/SHA256SUMS"
          python3 lambda_build.py verify --release-dir "$RELEASE_DIR" --config examples/go-function/lambda-build.toml

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
